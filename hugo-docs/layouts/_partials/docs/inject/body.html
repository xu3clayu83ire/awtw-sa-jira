<script>
document.addEventListener('DOMContentLoaded', () => {
  const article = document.querySelector('.book-article')
  if (!article) return

  // 任務標題（h3）結尾通常是「⬜／✅　🤖／👤 AI/手動 執行」，
  // 把這段抽出來做成狀態徽章，一眼看出任務完不完成，不用整段夾在標題文字裡讀
  article.querySelectorAll('h3').forEach((h3) => {
    const anchor = h3.querySelector('a.anchor')
    const textNode = Array.from(h3.childNodes).find((n) => n.nodeType === Node.TEXT_NODE && /[⬜✅]/.test(n.textContent))
    if (!textNode) return

    const match = textNode.textContent.match(/^(.*?)([⬜✅].*)$/)
    if (!match) return

    const [, title, statusText] = match
    textNode.textContent = title.trimEnd()

    const badge = document.createElement('span')
    badge.className = statusText.includes('✅') ? 'status-badge status-done' : 'status-badge status-pending'
    badge.textContent = statusText.trim()

    if (anchor) {
      h3.insertBefore(badge, anchor)
    } else {
      h3.appendChild(badge)
    }
  })

  // 完成定義清單：依文字內容分類，讓不同性質的項目視覺上區分開
  // （純 CSS 選擇器無法依文字內容判斷，用 JS 加 class）
  article.querySelectorAll('li').forEach((li) => {
    const text = li.textContent.trim()
    if (text.startsWith('測試命名')) li.classList.add('dod-testname')
    else if (text.includes('覆蓋率')) li.classList.add('dod-coverage')
  })
})
</script>
